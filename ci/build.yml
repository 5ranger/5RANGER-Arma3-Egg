# Builds and publishes ghcr.io/5ranger/5ranger-arma3:latest.
#
# Upstream:   this repository's Dockerfile and entrypoint.sh
# Downstream: the package Wings pulls for the Arma 3 egg
# Uses:       docker/build-push-action; the workflow's own GITHUB_TOKEN for ghcr
#
# THIS FILE MUST BE MOVED TO .github/workflows/build.yml TO RUN.
# It is parked here because a GitHub personal access token cannot write to
# .github/workflows/ without the `workflow` scope. Moving it is a one-off:
#
#     git mv ci/build.yml .github/workflows/build.yml
#
# The first successful run creates the package as private; make it public from the
# package's own settings, because Wings is configured with no registry credentials.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A script error here would not surface until a game server failed to boot.
      - name: Syntax-check entrypoint
        run: bash -n entrypoint.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/5ranger/5ranger-arma3:latest
